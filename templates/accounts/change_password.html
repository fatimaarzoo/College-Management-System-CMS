{% extends "home/base.html" %}
{% block content %}

		<!-- START SECTION TOP -->
		<section class="section-top">
	
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div id="message" class="bg-danger">
                    
                </div>
                <div class="card-header">
                    <h3 class="mb-0">Change Password</h3>
                </div>
                

                <div class="card-body">

                    <form id="courseForm">

                        <div class="mb-3">
                           
                            

                            Old Password:<input
                                type="text"
                                class="form-control"
                                id="old"
                                placeholder="Enter Old Password"
                                required
                               
                            >
                            
                            New Password : <input
                                type="text"
                                class="form-control"
                                id="new"
                                placeholder="Enter New Password"
                              
                                required
                            >
                            Confirm Password : <input
                                type="text"
                                class="form-control"
                                id="confirm"
                                placeholder="Enter Confirm Password"
                              
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Submit 
                        </button>

                    </form>

                    <div id="message" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>
</div>	
</section>
<!-- END COURSE -->		

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>


 $("#courseForm").submit(function(e){
    e.preventDefault();
    
    const access_token = localStorage.getItem("access_token");
    console.log(access_token);
    new_pass= $("#new").val();
    confirm_pass=$("#confirm").val();
    if(new_pass == confirm_pass){
    
    

    $.ajax({
      url: "/cms/accounts/change_password",
      type : "POST",
      contentType: "application/json",
      headers: {"Authorization": `Bearer ${access_token}`},
      data: JSON.stringify({
        old_pass: $("#old").val(),
        new_pass: $("#new").val(),
        confirm_pass:$("#confirm").val(),
      }),
      success: function(response){
        console.log("Course updation Successful",response);
        
      },
      error: function(xhr){
        console.log("Course not Updated",xhr.responseText);
      }
      
    })
    }
    else{
        document.getElementById("message").innerHTML = "The password doesnt match try again"

    }
   
  })
</script>


{% endblock %}
